sources:
  - type: maven
    path: pom.xml
    modules:
      - maven_central
      - integration_tests
build:
  exasolDbVersions:
    - "2026.1.0" # Latest
    - "2025.1.13" # Newest LTS
  workflows:
    - name: "ci-build.yml"
      stepCustomizations:
        - action: REPLACE
          job: matrix-build
          stepId: setup-java
          content:
            name: Set up JDKs
            id: setup-java
            uses: actions/setup-java@v5
            with:
              distribution: temurin
              java-version: |-
                11
                17
                21
              cache: maven
        - action: INSERT_AFTER
          job: matrix-build
          stepId: build-pk-verify
          content:
            # Note that this restriction is required to be able to integration test against a modern version of derby.
            # Without this distinction we would be forced to use a non-maintained version of derby and thus have
            # vulnerabilities in our supply chain.
            name: Run Java 11 tests
            id: test-java-11
            run: |
              mvn --batch-mode clean test \
                  -Djava.version=11 \
                  -Dtest.excludeTags=requires-java-21 \
                  -Denforcer.skip=true \
                  -DossindexSkip=true \
                  -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
                  -DtrimStackTrace=false
